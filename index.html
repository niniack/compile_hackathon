<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Tidings</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; padding: 24px 40px; }

    input, button { font-size: 16px; padding: 8px; }
    #url-bar { display: flex; gap: 8px; margin-bottom: 16px; max-width: 600px; }
    #url-bar input { flex: 1; }
    #status { color: #999; font-size: 14px; margin-bottom: 16px; }

    /* Two-panel layout */
    #panels { display: flex; gap: 32px; }
    .panel { flex: 1; min-width: 0; }

    /* Article */
    .para { margin-bottom: 16px; line-height: 1.8; font-size: 17px; }
    .para.title { font-weight: 700; font-size: 22px; margin-bottom: 20px; }

    /* Sentence states */
    .sent { transition: background .15s; border-radius: 2px; padding: 1px 0; }
    .sent.focus { background: #fef08a; }
    .sent.done { color: #6b7280; }
  </style>
</head>
<body>

  <div id="url-bar">
    <input id="url" placeholder="Paste article URL" />
    <button onclick="loadArticle()">Load</button>
  </div>
  <div id="status"></div>
  <div id="panels">
    <div class="panel" id="article"></div>
    <div class="panel" id="right"></div>
  </div>

  <script>
    // All state lives on the server. JS just renders.

    function render(data) {
      // Status
      const parts = [`${data.done}/${data.total} translated`];
      if (data.focus >= 0) parts.push(`sentence ${data.focus + 1}`);
      document.getElementById('status').textContent = parts.join(' · ');

      // Article
      const art = document.getElementById('article');
      art.innerHTML = '';
      let sentIdx = 0;

      data.paragraphs.forEach((p, pi) => {
        const div = document.createElement('div');
        div.className = pi === 0 ? 'para title' : 'para';

        p.sentences.forEach(s => {
          const i = sentIdx++;
          const span = document.createElement('span');
          span.className = 'sent'
            + (i === data.focus ? ' focus' : '')
            + (data.states[i] === 'done' ? ' done' : '');
          span.textContent = s;
          span.onclick = async () => {
            const res = await fetch('/focus', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ idx: i })
            });
            render(await res.json());
          };
          div.appendChild(span);
        });

        art.appendChild(div);
      });
    }

    async function loadArticle() {
      const url = document.getElementById('url').value;
      document.getElementById('status').textContent = 'Loading...';

      const res = await fetch('/load-article', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const data = await res.json();

      if (data.error) {
        document.getElementById('status').textContent = data.error;
        return;
      }

      render(data);
    }
  </script>

</body>
</html>
