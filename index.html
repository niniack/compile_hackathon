<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Tidings</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; padding: 24px 40px; }

    input, button { font-size: 16px; padding: 8px; }
    #url-bar { display: flex; gap: 8px; margin-bottom: 16px; max-width: 600px; }
    #url-bar input { flex: 1; }
    #status { color: #999; font-size: 14px; margin-bottom: 16px; }

    /* Two-panel layout */
    #panels { display: flex; gap: 32px; }
    .panel { flex: 1; min-width: 0; }

    /* Article */
    .para { margin-bottom: 16px; line-height: 1.8; font-size: 17px; }
    .para.title { font-weight: 700; font-size: 22px; margin-bottom: 20px; }

    /* Sentence states */
    .sent { transition: background .15s; border-radius: 2px; padding: 1px 0; cursor: pointer; }
    .sent.focus { background: #fef08a; }
    .sent.done { color: #6b7280; }

    /* Right panel */
    .accepted { margin-bottom: 10px; line-height: 1.7; font-size: 16px; color: #374151; }
    #translate-box { display: flex; flex-direction: column; gap: 8px; }
    #translate-box textarea {
      width: 100%; font-size: 15px; padding: 8px; border: 1px solid #ddd;
      border-radius: 4px; resize: vertical; min-height: 60px; font-family: inherit;
      line-height: 1.5;
    }
    #translate-box button {
      align-self: flex-start; padding: 6px 16px; font-size: 14px;
      background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer;
    }
    #translate-box button:disabled { opacity: .5; cursor: wait; }
    .lingo-result { font-size: 14px; color: #16a34a; margin-top: 4px; line-height: 1.5; }
  </style>
</head>
<body>

  <div id="url-bar">
    <input id="url" placeholder="Paste article URL" />
    <button onclick="loadArticle()">Load</button>
  </div>
  <div id="status"></div>
  <div id="panels">
    <div class="panel" id="article"></div>
    <div class="panel" id="right"></div>
  </div>

  <script>
    // All state lives on the server. JS just renders.

    function render(data) {
      // Status
      const parts = [`${data.done}/${data.total} translated`];
      if (data.focus >= 0) parts.push(`sentence ${data.focus + 1}`);
      document.getElementById('status').textContent = parts.join(' · ');

      // Article
      const art = document.getElementById('article');
      art.innerHTML = '';
      let sentIdx = 0;

      data.paragraphs.forEach((p, pi) => {
        const div = document.createElement('div');
        div.className = pi === 0 ? 'para title' : 'para';

        p.sentences.forEach(s => {
          const i = sentIdx++;
          const span = document.createElement('span');
          span.className = 'sent'
            + (i === data.focus ? ' focus' : '')
            + (data.states[i] === 'done' ? ' done' : '');
          span.textContent = s;
          span.onclick = async () => {
            const res = await fetch('/focus', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ idx: i })
            });
            const d = await res.json();
            render(d);
            triggerLingo(i);
          };
          div.appendChild(span);
        });

        art.appendChild(div);
      });

      renderRight(data);
    }

    async function loadArticle() {
      const url = document.getElementById('url').value;
      document.getElementById('status').textContent = 'Loading...';

      const res = await fetch('/load-article', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const data = await res.json();

      if (data.error) {
        document.getElementById('status').textContent = data.error;
        return;
      }

      render(data);
      if (data.focus >= 0) triggerLingo(data.focus);
    }

    // Fire-and-forget: translate in background, re-render when done
    async function triggerLingo(idx) {
      const res = await fetch('/lingo', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ idx })
      });
      // only re-render if we actually got a new translation
      const d = await res.json();
      if (d.lingo && d.lingo[idx]) render(d);
    }

    function renderRight(data) {
      const right = document.getElementById('right');
      right.innerHTML = '';
      right.dataset.state = JSON.stringify(data);

      // Mirror paragraph structure from left side
      let sentIdx = 0;
      let inputPlaced = false;

      data.paragraphs.forEach((p, pi) => {
        const div = document.createElement('div');
        div.className = pi === 0 ? 'accepted title' : 'accepted';
        let hasContent = false;

        p.sentences.forEach(() => {
          const i = sentIdx++;
          if (data.states[i] === 'done') {
            const t = data.translations[i] || '';
            if (t) {
              if (hasContent) div.appendChild(document.createTextNode(' '));
              div.appendChild(document.createTextNode(t));
              hasContent = true;
            }
          } else if (!inputPlaced && i === data.focus) {
            // Insert the input box inside this paragraph's flow
            if (hasContent) right.appendChild(div);
            inputPlaced = true;
          }
        });

        if (hasContent) right.appendChild(div);
      });

      // Input box for current focus sentence
      if (data.focus >= 0) {
        const idx = data.focus;
        const hasLingo = data.lingo && data.lingo[idx];
        const revealed = document.getElementById('right')?.dataset.revealed === String(idx);
        const box = document.createElement('div');
        box.id = 'translate-box';
        box.innerHTML = `
          <textarea id="user-input" placeholder="Translate this sentence…"></textarea>
          <div style="display:flex;gap:8px;align-items:center;">
            <button onclick="submitTranslation()">Judge</button>
            ${hasLingo ? `<button onclick="revealLingo()" style="background:${revealed ? '#9ca3af' : '#16a34a'}" ${revealed ? 'disabled' : ''}>Reveal</button>` : '<span style="color:#aaa;font-size:13px;">Translating…</span>'}
          </div>
          ${revealed ? '<div class="lingo-result"><b>Lingo.dev:</b> ' + data.lingo[idx] + '</div>' : ''}
        `;
        right.appendChild(box);
        setTimeout(() => document.getElementById('user-input')?.focus(), 0);
      }
    }

    function revealLingo() {
      const right = document.getElementById('right');
      // Mark as revealed so re-render shows it
      const state = JSON.parse(right.dataset.state || '{}');
      right.dataset.revealed = String(state.focus);
      renderRight(state);
    }

    async function submitTranslation() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      const state = await fetch('/state').then(r => r.json());
      const idx = state.focus;

      // Send user translation to the backend for judgment
      const judgeRes = await fetch('/judge', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idx, user_translation: text })
      });

      if (judgeRes.ok) {
        const { judgment } = await judgeRes.json();
        alert(`Judgment: ${judgment}`); // Display the LLM's judgment
      } else {
        const error = await judgeRes.json();
        alert(`Error: ${error.detail}`);
      }

      // Accept the translation after judgment
      const res = await fetch('/accept', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idx, text })
      });
      render(await res.json());
    }
  </script>

</body>
</html>
